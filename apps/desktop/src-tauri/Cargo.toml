[package]
name = "issue-pipeline"
version = "0.1.0"
description = "Turn rough issue notes into well-formed Gitea issues"
authors = ["Kayela"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "issue_pipeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false to keep native-tls out; rustls means one TLS stack
# on every platform. system-proxy so the app still works behind a corporate proxy.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "http2",
  "charset",
  "system-proxy",
] }
thiserror = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
