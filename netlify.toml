# Single Netlify config for the monorepo, at the repository root.
#
# The CLI resolves `publish` and `functions` from the repository root even when
# `--filter` names a workspace package, so these paths are written root-relative
# and the site is deployed with no base directory set.
#
# One site serves both the React SPA (static) and the API (functions), so the
# browser talks to a single origin: no CORS, and the session cookie is
# first-party.

[build]
  # Functions are bundled by Netlify from TypeScript source; the SPA is built by
  # Vite. Both depend on the compiled shared contract package.
  command = "pnpm --filter @issue-pipeline/shared build && pnpm --filter @issue-pipeline/web build"
  publish = "apps/web/dist"
  functions = "apps/api/netlify/functions"

[build.environment]
  # Netlify's secrets scanner fails the build if any configured env var's
  # value appears anywhere in the repo or build output. These are
  # legitimately non-secret (an org name, a public Gitea host, a build mode,
  # the provider name, and three unused leftover names -- see
  # docs/ARCHITECTURE.md section 13) and their values collide with ordinary
  # words/identifiers used throughout the code, tests, and docs. Real secrets
  # (API keys, including VENICE_API_KEY, plus SESSION_SECRET, DATABASE_URL,
  # GITEA_OAUTH_CLIENT_SECRET, INTERNAL_JOB_SECRET) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "GITEA_BASE_URL,GITEA_ALLOWED_ORG,NODE_ENV,LLM_PROVIDER,MODEL_SELECT,MODEL_DRAFT,VENICE_BASE_URL"

[functions]
  node_bundler = "esbuild"

[dev]
  # `netlify dev` fronts Vite on :8888 alongside the functions. Always browse
  # http://localhost:8888 -- that is the registered OAuth redirect origin.
  framework = "#custom"
  command = "pnpm --filter @issue-pipeline/web dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Any /api/* path with no function is a JSON 404, never the SPA shell.
# Not forced: a forced rule shadows existing content, and in production that
# includes functions with a config.path, so every /api route returned this 404.
# (`netlify dev` let functions win even when forced; unknown /api paths there
# may now fall through to Vite's SPA shell instead.)
[[redirects]]
  from = "/api/*"
  to = "/api-not-found.json"
  status = 404

# Client-side routes (/login, /queue, ...) all serve the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers that are safe in development too. The script/style/connect policy is
# injected as a <meta> tag at build time only (see apps/web/vite.config.ts),
# because Vite's dev server relies on inline scripts for hot reload.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
